<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain</title>
<meta name="description" content="To-dos – schnell diktiert, klar sortiert.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F4F5F7; --sidebar:#EDEEF1; --surface:#FFFFFF; --surface-2:#F3F4F6; --surface-3:#E7E9ED;
  --text:#1B1C1F; --text-2:#62666F; --text-3:#9A9EA7;
  --line:rgba(24,28,38,.09); --line-2:rgba(24,28,38,.16);
  --accent:#3453C9; --accent-soft:rgba(52,83,201,.09); --on-accent:#FFFFFF;
  --work:#4D6B9E; --private:#5C8B72; --danger:#C0473A; --warn:#A87424; --ok:#3F8A5B;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 20px rgba(20,24,33,.07);
  --shadow-lg:0 24px 64px rgba(20,24,33,.20),0 2px 6px rgba(20,24,33,.06);
  --scrim:rgba(24,26,32,.26); --glass:rgba(255,255,255,.8);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E10; --sidebar:#131417; --surface:#18191C; --surface-2:#202226; --surface-3:#2A2C31;
    --text:#ECEDEF; --text-2:#A2A5AD; --text-3:#6C6F77;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
    --accent:#8FA6F5; --accent-soft:rgba(143,166,245,.13); --on-accent:#0E1224;
    --work:#89A4D2; --private:#89B79D; --danger:#E27463; --warn:#D9A34E; --ok:#6FBF8D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    --shadow-lg:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
    --scrim:rgba(0,0,0,.5); --glass:rgba(24,25,28,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E10; --sidebar:#131417; --surface:#18191C; --surface-2:#202226; --surface-3:#2A2C31;
  --text:#ECEDEF; --text-2:#A2A5AD; --text-3:#6C6F77;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --accent:#8FA6F5; --accent-soft:rgba(143,166,245,.13); --on-accent:#0E1224;
  --work:#89A4D2; --private:#89B79D; --danger:#E27463; --warn:#D9A34E; --ok:#6FBF8D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5); --glass:rgba(24,25,28,.82);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--surface); color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--text-3));flex:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100vh;height:100dvh}
.app.has-detail{grid-template-columns:260px minmax(0,1fr) 372px}
.sidebar{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;min-height:0}
.main{overflow-y:auto;min-height:0;background:var(--surface)}
.main-inner{max-width:780px;margin:0 auto;padding:34px 40px 120px}
.detail{display:none;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0}
.app.has-detail .detail{display:block}

/* ---------- Sidebar ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 6px}
.brand-name{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.logo{width:22px;height:22px;border-radius:7px;background:var(--text);display:grid;place-items:center}
.logo svg{width:14px;height:14px;stroke:var(--surface);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-3);border-radius:9px;padding:6px 9px;color:var(--text-3)}
.search input{border:0;background:none;outline:none;width:100%;font-size:13.5px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:10px 11px 9px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:0 0 0 1px var(--line);transition:background .15s}
.tile:hover{background:var(--surface-2)}
.tile-top{display:flex;justify-content:space-between;align-items:center;color:var(--text-2)}
.tile-n{font-size:20px;font-weight:650;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.tile-l{font-size:13px;font-weight:600;color:var(--text-2)}
.tile.on{background:var(--accent);box-shadow:none}
.tile.on .tile-top,.tile.on .tile-n,.tile.on .tile-l{color:var(--on-accent)}
.tile-new{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:center;gap:9px;padding:11px 12px;background:var(--text);box-shadow:none}
.tile-new:hover{background:var(--text);opacity:.88}
.tile-new .tile-l,.tile-new svg.i{color:var(--surface)}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;text-align:left;color:var(--text);font-size:13.5px}
.sb-item:hover{background:var(--surface-3)}
.sb-item.on{background:var(--accent-soft);color:var(--accent);font-weight:550}
.sb-item .cnt{margin-left:auto;color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.sb-item.on .cnt{color:var(--accent)}
.sb-item svg.i{color:var(--text-2)}
.sb-item.on svg.i{color:var(--accent)}
.sb-item .dot{width:7px;height:7px;margin:0 3px 0 5px;opacity:.85}
.sb-item .lead{display:flex;align-items:center}
.sb-item .lead svg.i{color:inherit}
.sb-item .chev{width:15px;height:15px;color:var(--text-3);transition:transform .15s;margin-right:-2px}
.sb-item.is-open .chev{transform:rotate(90deg)}
.sb-item .cnt:empty{margin-left:auto}
.sb-sub{padding-left:30px}
.sb-more{color:var(--text-3)}
.sb-more svg.i{width:15px;height:15px}
.sb-new.sb-sub{padding-left:30px}
.sb-new{display:flex;gap:6px;padding:3px 6px}
.sb-new input,.add-in{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13.5px;outline:none}
.sb-new input:focus,.add-in:focus{border-color:var(--accent)}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px 4px 0;border-top:1px solid var(--line)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:0 4px}
".sync .dot{width:7px;height:7px}
.sync .link{margin-left:auto;white-space:nowrap}
.auth-l{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.auth-in{border:1.5px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:16px;background:var(--surface);color:var(--text);outline:none;font-weight:400}
.auth-in:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.auth-err{color:var(--danger);font-size:13px;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);border-radius:9px;padding:2px;gap:2px}
.seg button{font-size:12.5px;padding:5px 9px;border-radius:7px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:550}

/* ---------- Main headers ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:7px}
h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{color:var(--text-2);font-size:13.5px;margin-top:5px}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:550;white-space:nowrap}
.btn-p{background:var(--text);color:var(--surface)}
.btn-p:hover{opacity:.88}
.btn-g{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn-g:hover{background:var(--surface-3)}
.btn-t{color:var(--text-2);padding:0 8px}
.btn-t:hover{color:var(--text)}
.btn-d{background:var(--danger);color:#fff}
.btn-s{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* Quick add */
.qa{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:46px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s,background .15s}
.qa:focus-within{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.qa input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.qa input::placeholder{color:var(--text-3)}
.qa .i{color:var(--text-3)}
.qa:focus-within .i{color:var(--accent)}
kbd{font:500 11px/1 -apple-system,system-ui,sans-serif;color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px}
.qa-hint{font-size:12.5px;color:var(--text-3);margin:8px 2px 0}
.link{color:var(--accent);font-weight:550}
.link:hover{text-decoration:underline}

/* Week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:22px 0 6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:12px;color:var(--text-2)}
.wday:hover{background:var(--surface-2)}
.wday .wd{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.wday .dn{font-size:17px;font-weight:600;color:var(--text);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wday.today .dn{background:var(--accent);color:var(--on-accent)}
.wday.past .dn{color:var(--text-3)}
.wday.sel .dn{box-shadow:inset 0 0 0 1.5px var(--text)}
.wk-head{display:flex;align-items:baseline;gap:10px;margin:22px 4px -12px;font-size:12.5px;color:var(--text-2)}
.wk-head strong{font-size:13.5px;font-weight:650;color:var(--text)}
.wdots{display:flex;gap:3px;height:6px}
.wdots .dot{width:5px;height:5px}
.wweek{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:8px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:8px}
.wweek .bar{height:4px;flex:1;border-radius:4px;background:linear-gradient(90deg,var(--work),var(--private));opacity:.35}

/* Sections & rows */
.sec{display:flex;align-items:baseline;gap:8px;margin:28px 0 4px;padding:0 4px}
.sec h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.sec .n{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.sec.danger h3{color:var(--danger)}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;position:relative;transition:background .12s,opacity .3s,transform .3s}
.row::after{content:"";position:absolute;left:40px;right:8px;bottom:0;height:1px;background:var(--line)}
.row:last-child::after{display:none}
.row:hover{background:var(--surface-2)}
.row:hover::after,.row.is-sel::after{opacity:0}
.row.is-sel{background:var(--accent-soft)}
.row.completing{opacity:0;transform:translateX(8px)}
.check{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--c);display:grid;place-items:center;flex:none;margin-top:0;transition:background .15s}
.check svg{width:13px;height:13px;stroke:var(--surface);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.check.on{background:var(--c)}
.check.on svg{opacity:1}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.row.is-done .row-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--text-2)}
.row-meta>span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.row-meta .dot{width:7px;height:7px}
.row-meta svg.i{width:13px;height:13px}
.av{width:18px;height:18px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:9.5px;font-weight:650;display:inline-grid;place-items:center;letter-spacing:.02em;flex:none}
.avs{display:inline-flex}
.avs .av{box-shadow:0 0 0 1.5px var(--surface)}
.avs .av+.av{margin-left:-5px}
.row-right{flex:none;text-align:right;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-top:1px}
.row-right .k{font-size:11.5px;color:var(--text-3)}
.row-right .over{color:var(--danger);font-weight:550}
.row-right .fuzzy{color:var(--text)}
.muted{color:var(--text-3);font-size:12.5px}
.swipe{position:relative;overflow:hidden;border-radius:10px}
.swipe>.row{background:var(--surface);transition:transform .18s ease}
.swipe.dragging>.row{transition:none}
.swipe-act{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--danger);border-radius:10px}
.swipe-act button{display:flex;align-items:center;gap:6px;color:#fff;font-weight:600;font-size:13.5px;padding:0 18px}
.swipe-act svg.i{stroke:#fff}
.confirm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:26px 8px;color:var(--text-3);font-size:14px;line-height:1.5}
.empty-big{padding:40px 8px;text-align:center;color:var(--text-3)}
.empty-big strong{display:block;color:var(--text-2);font-size:16px;font-weight:600;margin-bottom:4px}
.more{display:inline-flex;margin:18px 4px 0;font-size:13.5px}

/* Toolbars */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.toolbar .search{background:var(--surface-2);flex:1;min-width:180px;box-shadow:inset 0 0 0 1px var(--line)}
.tb-label{font-size:12px;color:var(--text-3);margin-right:-4px}

/* Info block */
.note{margin-top:34px;padding:16px 18px;border-radius:14px;background:var(--surface-2);display:flex;gap:14px;align-items:flex-start}
.note .i{color:var(--text-2);margin-top:2px}
.note h4{margin:0 0 4px;font-size:13.5px;font-weight:650}
.note p{margin:0;color:var(--text-2);font-size:13px;line-height:1.5;max-width:62ch}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--text-2)}
.flow span{background:var(--surface);padding:4px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.flow i{font-style:normal;color:var(--text-3)}

/* People & projects */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:10px;text-align:left;position:relative;width:100%}
.prow:hover{background:var(--surface-2)}
.prow::after{content:"";position:absolute;left:58px;right:8px;bottom:0;height:1px;background:var(--line)}
.prow:last-child::after{display:none}
.prow .av{width:36px;height:36px;font-size:13px}
.prow .pm{flex:1;min-width:0}
.prow .pn{font-size:15px;font-weight:550}
.prow .ps{font-size:12.5px;color:var(--text-2);margin-top:1px}
.prow .chev{color:var(--text-3)}
.pico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);flex:none}
.prog{width:120px;height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--c);border-radius:5px}
.prog-l{font-size:12px;color:var(--text-3);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.addbar{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.addbar .add-in{max-width:280px}

/* Settings */
.set-sec{margin-top:30px}
.set-sec>h3{margin:0 0 2px;font-size:15px;font-weight:650}
.set-sec>p{margin:0 0 10px;color:var(--text-2);font-size:13px;max-width:62ch;line-height:1.5}
.set-sub{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 4px;display:flex;align-items:center;gap:7px}
.set-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.ren{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px;padding:7px 8px;border-radius:8px}
.ren:hover{background:var(--surface-2)}
.ren:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent)}
.set-row .muted{flex:none}
.set-row .seg{flex:none}
.set-card{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:4px 12px}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.cal-head h2{margin:0 auto 0 0;font-size:20px;font-weight:650;letter-spacing:-.015em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-bar{width:22px;height:8px;border-radius:3px;background:color-mix(in srgb,var(--work) 22%,transparent)}
.lg-band{width:22px;height:8px;border-radius:3px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--private) 25%,transparent) 0 3px,transparent 3px 6px)}
.mstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px 10px;margin-bottom:10px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 1px var(--line)}
.mstrip .lab{font-size:12px;color:var(--text-2);font-weight:600;margin-right:4px}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 9px;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase;padding:0 0 6px}
.cal-dow span{padding-left:8px}
.cal{border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:108px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}

<script>
'use strict';
const APP_VERSION = '1.0';

/* ============ Datum ============ */
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const same = (a, b) => a.getTime() === b.getTime();
const mondayOf = d => addD(d, -((d.getDay() + 6) % 7));
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const wd = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - wd); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / DAY + 1) / 7); }
let TODAY, THIS_MON, NEXT_MON, AFTER_NEXT;
function refreshToday(){
  const n = new Date();
  TODAY = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  THIS_MON = mondayOf(TODAY); NEXT_MON = addD(THIS_MON, 7); AFTER_NEXT = addD(THIS_MON, 14);
}
refreshToday();
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const nextMonthKey = () => monthKey(new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 1));
const longDate = d => `${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const wordRe = (k, flags = 'i') => new RegExp('(^|[^0-9A-Za-zÄÖÜäöüß])' + escRe(k) + '(?![0-9A-Za-zÄÖÜäöüß])', flags);
const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); });

/* ============ Icons ============ */
const ICONS = {
  today:'<circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
  inbox:'<path d="M4 13.5l2.4-7.2a1 1 0 0 1 .95-.8h9.3a1 1 0 0 1 .95.8L20 13.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13.5h4.3l1.2 2.2h5l1.2-2.2H20"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5"/>',
  list:'<path d="M9.5 7h10M9.5 12h10M9.5 17h10"/><circle cx="5.2" cy="7" r=".9"/><circle cx="5.2" cy="12" r=".9"/><circle cx="5.2" cy="17" r=".9"/>',
  person:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/>',
  folder:'<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h3.8l2 2h7.2A1.5 1.5 0 0 1 20 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/>',
  done:'<circle cx="12" cy="12" r="8"/><path d="M8.6 12.3l2.3 2.3 4.6-4.8"/>',
  archive:'<rect x="3.5" y="5" width="17" height="4" rx="1.2"/><path d="M5.2 9v9a1.5 1.5 0 0 0 1.5 1.5h10.6a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/>',
  mic:'<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M19.5 19.5L15.4 15.4"/>',
  chevL:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  chevR:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l.9 12h8.2L17 7"/>',
  close:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  menu:'<path d="M4.5 7h15M4.5 12h15M4.5 17h15"/>',
  diamond:'<path d="M12 4.5l7.5 7.5-7.5 7.5L4.5 12z"/>',
  wave:'<path d="M4 12h.5M7.5 9.5v5M11 6.5v11M14.5 8.5v7M18 10.5v3"/>',
  spark:'<path d="M12 4.5l1.7 4.6 4.8 1.6-4.8 1.6L12 17l-1.7-4.7-4.8-1.6 4.8-1.6z"/><path d="M18.5 16v3M17 17.5h3"/>',
  edit:'<path d="M5 19h3.5L18.5 9a2.1 2.1 0 0 0-3-3L5.5 16z"/>',
  work:'<rect x="3.5" y="7.5" width="17" height="11.5" rx="2"/><path d="M9 7.5V6.2A1.7 1.7 0 0 1 10.7 4.5h2.6A1.7 1.7 0 0 1 15 6.2v1.3M3.5 12.5h17"/>',
  home:'<path d="M4.5 10.6L12 4.6l7.5 6V19a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M9.5 20v-5.5h5V20"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"/>',

};
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ============ Daten ============ */
const AREAS = { work:{ name:'Arbeit', color:'var(--work)' }, private:{ name:'Privat', color:'var(--private)' } };
let T = [], CATS = [], PEOPLE = [], PROJECTS = [];
const ARR = { todos:() => T, cats:() => CATS, people:() => PEOPLE, projects:() => PROJECTS };
const ARCHIVE_DAYS = 21;

/* IndexedDB – einzige Datenquelle auf dem Gerät. Gelöschtes bleibt als „Tombstone“ für den späteren Sync. */
let idb = null;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('klar', 1);   // interner Name bleibt – Umbenennen würde die gespeicherten Daten verlieren
    r.onupgradeneeded = () => {
      const d = r.result;
      ['todos', 'cats', 'people', 'projects'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:'id' }); });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath:'key' });

/* Doppelte Kategorien, Personen oder Projekte zusammenlegen.
   Entsteht, wenn zwei Geräte unabhängig dieselbe Bezeichnung angelegt haben und dann abgeglichen wurden. */
function dedupe(){
  let merged = 0;
  const fix = (store, arr, keyOf, relink) => {
    const keep = new Map();
    // Feste Start-IDs (00000000-…) zuerst: sie bleiben erhalten, damit weitere Geräte daran andocken.
    const gross = o => /^[A-ZÄÖÜ]/.test((o.name || '').trim()) ? 1 : 0;
    [...arr].sort((a, b) => (b.id.startsWith('00000000') - a.id.startsWith('00000000')) || (gross(b) - gross(a)) || String(a.id).localeCompare(String(b.id)))
      .forEach(o => {
        const k = keyOf(o), winner = keep.get(k);
        if (!winner){ keep.set(k, o); return; }
        T.forEach(t => { if (relink(t, o.id, winner.id)) save('todos', t); });
        tomb(store, o);
        merged++;
      });
  };
  fix('cats', CATS, c => `${c.area}\n${c.name.trim().toLowerCase()}`, (t, from, to) => { if (t.cat === from){ t.cat = to; return true; } });
  fix('people', PEOPLE, p => p.name.trim().toLowerCase(), (t, from, to) => { if (t.persons.includes(from)){ t.persons = [...new Set(t.persons.map(x => x === from ? to : x))]; return true; } });
  fix('projects', PROJECTS, p => p.name.trim().toLowerCase(), (t, from, to) => { if (t.project === from){ t.project = to; return true; } });
  return merged;
}

function range(t){
  if (!t.due) return null;
  if (t.due.type === 'day'){ const d = P(t.due.date); return [d, d]; }
  if (t.due.type === 'week'){ const s = P(t.due.start); return [s, addD(s, 6)]; }
  const s = P(t.due.month + '-01'); return [s, new Date(s.getFullYear(), s.getMonth() + 1, 0)];
}
const endKey = t => { const r = range(t); return r ? r[1].getTime() : Infinity; };
function bucket(t){
  const r = range(t); if (!r) return 'none';
  const [s, e] = r;
  if (e < TODAY) return 'overdue';
  if (t.due.type === 'day' && same(s, TODAY)) return 'today';
  if (e < NEXT_MON) return 'week';
  if (s >= NEXT_MON && e < AFTER_NEXT) return 'next';
  return 'later';
}
function dueLabel(t){
  if (!t.due) return { txt:'', cls:'', k:'' };
  const [s, e] = range(t);
  const over = isOpen(t) && e < TODAY;
  let txt = '', k = '';
  if (t.due.type === 'day'){
    if (same(s, TODAY)) txt = 'Heute';
    else if (same(s, addD(TODAY, 1))) txt = 'Morgen';
    else if (same(s, addD(TODAY, -1))) txt = 'Gestern';
    else if (s > TODAY && s < NEXT_MON) txt = WDL[s.getDay()];
    else txt = `${WD[s.getDay()]} ${s.getDate()}. ${MONS[s.getMonth()]}` + (s.getFullYear() !== TODAY.getFullYear() ? ` ${s.getFullYear()}` : '');
  } else if (t.due.type === 'week'){
    txt = same(s, THIS_MON) ? 'Diese Woche' : same(s, NEXT_MON) ? 'Nächste Woche' : `${s.getDate()}.–${e.getDate()}. ${MONS[e.getMonth()]}`;
    k = `KW ${kw(s)}`;
  } else {
    txt = MON[s.getMonth()] + (s.getFullYear() !== TODAY.getFullYear() ? ' ' + s.getFullYear() : '');
    k = 'ganzer Monat';
  }
  return { txt, k, cls: over ? 'over' : (t.due.type !== 'day' ? 'fuzzy' : '') };
}
const sortByDue = (a, b) => endKey(a) - endKey(b) || a.title.localeCompare(b.title, 'de');
const buckets = () => [
  ['overdue', 'Überfällig', 'danger'], ['today', 'Heute'],
  ['week', `Diese Woche · KW ${kw(TODAY)}`], ['next', `Nächste Woche · KW ${kw(NEXT_MON)}`],
  ['later', 'Später'], ['none', 'Ohne Datum']
];
function bucketGroups(list, only){
  return buckets().filter(b => !only || only.includes(b[0])).map(([k, title, cls]) => ({ title, cls, items: list.filter(t => bucket(t) === k).sort(sortByDue) }));
}
const daysSince = s => Math.round((TODAY - P(s)) / DAY);
function autoArchive(){

}

const stripMeta = o => { const c = { ...o }; delete c._srv; return c; };
async function markSynced(kind, id, ts){
  const rec = await req(idb.transaction(kind).objectStore(kind).get(id));
  if (rec){ rec._srv = ts; put(kind, rec); }
  const local = ARR_OF(kind).find(x => x.id === id);
  if (local) local._srv = ts;
}
async function pushChanges(tok){
  const rows = [];
  for (const kind of KINDS)
    for (const o of await getAll(kind))
      if (o.updatedAt && o._srv !== o.updatedAt) rows.push({ id:o.id, kind, data:stripMeta(o), updated_at:o.updatedAt, deleted:!!o.deleted });
  for (let i = 0; i < rows.length; i += 200){
    const chunk = rows.slice(i, i + 200);
    const r = await fetch(`${SB.url}/rest/v1/items?on_conflict=id`, {
      method:'POST',
      headers:{ apikey:SB.key, Authorization:`Bearer ${tok}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' },
      body:JSON.stringify(chunk)
    });
    if (!r.ok) throw new Error('Hochladen fehlgeschlagen (' + r.status + '): ' + (await r.text()).slice(0, 120));
    for (const row of chunk) await markSynced(row.kind, row.id, row.updated_at);

function applyRemote(row){
  const arr = ARR_OF(row.kind); if (!arr) return false;
  if ((TOMB.get(row.id) || 0) >= row.updated_at) return false;      // lokal gelöscht und neuer
  const local = arr.find(x => x.id === row.id);
  if (local && local.updatedAt >= row.updated_at) return false;     // lokal ist neuer
  if (row.deleted){
    if (local) arr.splice(arr.indexOf(local), 1);
    TOMB.set(row.id, row.updated_at);
    put(row.kind, { id:row.id, deleted:true, updatedAt:row.updated_at, _srv:row.updated_at });
  } else {
    const obj = { ...row.data, id:row.id, updatedAt:row.updated_at, _srv:row.updated_at };
    if (local) Object.assign(local, obj); else arr.push(obj);
    put(row.kind, obj);

}

  let since = (await getMeta('lastPull')) || '1970-01-01T00:00:00Z', applied = 0, guard = 0, more = true;

    const url = `${SB.url}/rest/v1/items?select=id,kind,data,updated_at,deleted,synced_at&synced_at=gt.${encodeURIComponent(since)}&order=synced_at.asc&limit=500`;
    const r = await fetch(url, { headers:{ apikey:SB.key, Authorization:`Bearer ${tok}` } });
    if (!r.ok) throw new Error('Laden fehlgeschlagen (' + r.status + '): ' + (await r.text()).slice(0, 120));
    const rows = await r.json();
    for (const row of rows){ if (applyRemote(row)) applied++; since = row.synced_at; }

  }).join('');
  const weekHead = `<div class="wk-head"><strong>KW ${kw(TODAY)}</strong><span>${THIS_MON.getDate()}. ${THIS_MON.getMonth() !== sun.getMonth() ? MON[THIS_MON.getMonth()] + ' ' : ''}– ${sun.getDate()}. ${MON[sun.getMonth()]}</span></div>`;
  let body;

    const weekItems = open.filter(t => t.due?.type === 'week' && same(P(t.due.start), THIS_MON));

      (hasAny ? groupsHTML(groups) : empty) +
      (rest ? `<button class="link more" data-act="nav" data-view="all">${rest} weitere für später oder ohne Datum</button>` : '');
  } else {

    body = `<div class="sec"><h3>${esc(longDate(sel))}</h3><span class="n">${items.length}</span><button class="link" style="margin-left:auto;font-size:13px" data-act="today-day" data-d="${iso(TODAY)}">Zurück zu heute</button></div>` +
      (items.length ? `<div>${items.map(t => rowHTML(t)).join('')}</div>` : `<div class="empty">An diesem Tag ist nichts fällig.</div>`);
  }
  return header('Heute', esc(longDate(TODAY)), '', mob ? '' : addBtn()) + (mob ? '' : quickAdd()) + weekHead + `<div class="wstrip">${strip}</div>` + body;
}

}

function viewCalendar(){
  const mob = isMobile();
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0);
  const vis = T.filter(t => t.due && (isOpen(t) || t.status === 'done'));
  let weeks = '';
  for (let ws = mondayOf(first); ws <= last; ws = addD(ws, 7)){
    const allBars = vis.filter(t => t.due.type === 'week' && same(P(t.due.start), ws));
    // Handy: höchstens 3 schmale Streifen, damit genug Fläche zum Antippen des Tages bleibt
    const bars = mob ? allBars.slice(0, 3) : allBars;
    const rows = `auto ${bars.map(() => 'auto').join(' ')} 1fr`;
    let cells = '', nums = '', items = '';
    for (let i = 0; i < 7; i++){
      const d = addD(ws, i), out = d.getMonth() !== mo, isToday = same(d, TODAY);
      cells += `<div class="cbg c${i} ${i >= 5 ? 'we' : ''} ${out ? 'out' : ''} ${iso(d) === S.calDay ? 'sel' : ''}" style="grid-column:${i + 1}" data-act="cal-day" data-d="${iso(d)}"></div>`;
      nums += `<div class="cnum ${out ? 'out' : ''} ${isToday ? 'today' : ''}" style="grid-column:${i + 1}"><span>${d.getDate() === 1 ? `1. ${MONS[d.getMonth()]}` : d.getDate()}</span></div>`;
      const di = vis.filter(t => t.due.type === 'day' && same(P(t.due.date), d)).sort((a, b) => a.title.localeCompare(b.title, 'de'));
      items += `<div class="citems" style="grid-row:${2 + bars.length};grid-column:${i + 1}">${di.slice(0, 3).map(t => `<button class="citem ${t.status === 'done' ? 'done' : ''} ${dueLabel(t).cls === 'over' ? 'over' : ''}" data-act="open" data-id="${t.id}" title="${esc(t.title)}"><i class="dot" style="--c:${areaColor(areaOf(t))}"></i><span class="t">${esc(t.title)}</span></button>`).join('')}${di.length > 3 ? `<span class="cmore">+${di.length - 3}</span>` : ''}</div>`;
    }
    const barHTML = bars.map((t, j) => mob
      ? `<span class="cbar mini ${t.status === 'done' ? 'done' : ''}" style="grid-row:${2 + j};--c:${areaColor(areaOf(t))}" title="${esc(t.title)}"></span>`
      : `<button class="cbar ${t.status === 'done' ? 'done' : ''}" style="grid-row:${2 + j};--c:${areaColor(areaOf(t))}" data-act="open" data-id="${t.id}"><i class="dot"></i><span class="t">${esc(t.title)}</span><span class="k">KW ${kw(ws)}</span></button>`).join('');
    weeks += `<div class="wk" style="grid-template-rows:${rows}">${cells}${nums}${barHTML}${items}</div>`;
  }
  const monthItems = vis.filter(t => t.due.type === 'month' && t.due.month === monthKey(first));
  const sd = P(S.calDay);
  const order = { day:0, week:1, month:2 };
  const dayList = vis.filter(t => { const [s, e] = range(t); return s <= sd && e >= sd; }).sort((a, b) => order[a.due.type] - order[b.due.type]);
  return header('Kalender', 'Feste Termine als Punkt, „nächste Woche“ als Balken, „nächster Monat“ als Band.', '', addBtn()) +
    `<div class="cal-head"><h2>${MON[mo]} ${y}</h2><button class="icon-btn" data-act="cal-prev" aria-label="Vorheriger Monat">${ic('chevL')}</button><button class="btn btn-g btn-s" data-act="cal-today">Heute</button><button class="icon-btn" data-act="cal-next" aria-label="Nächster Monat">${ic('chevR')}</button></div>
    <div class="legend"><span><i class="dot" style="--c:var(--work)"></i>Arbeit</span><span><i class="dot" style="--c:var(--private)"></i>Privat</span><span><i class="lg-bar"></i>Wochen-Deadline</span><span><i class="lg-band"></i>Monats-Deadline</span></div>
    ${monthItems.length ? `<div class="mstrip"><span class="lab">Im Laufe des ${MON[mo]}s</span>${monthItems.map(t => `<button class="mchip" data-act="open" data-id="${t.id}"><i class="dot" style="--c:${areaColor(areaOf(t))}"></i>${esc(t.title)}</button>`).join('')}</div>` : ''}
    <div class="cal-dow">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal">${weeks}</div>
    <div class="sec"><h3>${esc(longDate(sd))}</h3><span class="n">${dayList.length}</span></div>
    <div>${dayList.length ? dayList.map(t => rowHTML(t)).join('') : '<div class="empty">Keine Deadlines an diesem Tag.</div>'}</div>`;
}

function renderMain(){

/* ============ Detail ============ */
/* Detail = Bearbeiten: jede Änderung wird sofort gespeichert. */
function renderDetail(){
  const t = T.find(x => x.id === S.sel);
  if (!t){ $('#app').classList.remove('has-detail'); $('#detail').innerHTML = ''; return; }
  let html;
  try { html = detailHTML(t); }
  catch (err){
    console.error(err);
    S.sel = null; $('#app').classList.remove('has-detail'); $('#detail').innerHTML = '';
    toast('Dieses To-do lässt sich gerade nicht öffnen.');
    return;
  }
  $('#detail').innerHTML = html;
  $('#app').classList.add('has-detail');
  $('#detail').querySelectorAll('textarea.grow').forEach(grow);
}
function grow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

/* ============ Sprach-Parser (regelbasiert; KI folgt in Etappe 4) ============ */
const L = '[a-zäöüß]';   // Buchstabe – für Wortgrenzen mit Umlauten
const MONTH = '(januar|jan|februar|feb|märz|maerz|mär|april|apr|mai|juni|jun|juli|jul|august|aug|september|sept|sep|oktober|okt|november|nov|dezember|dez)';
const MONTH_FULL = '(januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)';
const monthIdx = s => ({ jan:0, feb:1, mär:2, mae:2, apr:3, mai:4, jun:5, jul:6, aug:7, sep:8, okt:9, nov:10, dez:11 })[s.toLowerCase().slice(0, 3)];
const ORD = ['erste','zweite','dritte','vierte','fünfte','sechste','siebte','achte','neunte','zehnte','elfte','zwölfte','dreizehnte','vierzehnte','fünfzehnte','sechzehnte','siebzehnte','achtzehnte','neunzehnte','zwanzigste','einundzwanzigste','zweiundzwanzigste','dreiundzwanzigste','vierundzwanzigste','fünfundzwanzigste','sechsundzwanzigste','siebenundzwanzigste','achtundzwanzigste','neunundzwanzigste','dreißigste','einunddreißigste'];
const ORD_RE = '(' + [...ORD].sort((a, b) => b.length - a.length).join('|') + ')[nrs]?';
const NUMW = { ein:1, eine:1, einem:1, einer:1, zwei:2, drei:3, vier:4, fünf:5, sechs:6, sieben:7, acht:8, neun:9, zehn:10 };
const WEEKDAYS = '(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)';
// Füllwörter vor einer Datumsangabe („bis zum“, „spätestens am“ …) – werden mit entfernt
const PFX = '(?:,?\\s*(?:und\\s+)?(?:zwar\\s+)?(?:spätestens\\s+)?(?:(?:bis|ab)\\s+(?:spätestens\\s+)?(?:zum\\s+|zur\\s+|am\\s+)?|am\\s+|zum\\s+|für\\s+|in\\s+der\\s+|im\\s+)?)';
const BOUND = '(^|[^a-zäöüß0-9])';
function mkDate(y, m, d){ const x = new Date(y, m, d); return x.getMonth() === ((m % 12) + 12) % 12 && x.getDate() === d ? x : null; }
function dateDM(d, m, y){
  if (y != null && !isNaN(y)){ if (y < 100) y += 2000; return mkDate(y, m, d); }
  let x = mkDate(TODAY.getFullYear(), m, d);
  if (x && x < addD(TODAY, -60)) x = mkDate(TODAY.getFullYear() + 1, m, d);
  return x;
}
const monthStart = mi => new Date(TODAY.getFullYear() + (mi < TODAY.getMonth() ? 1 : 0), mi, 1);
const dayDue = d => d ? day(iso(d)) : null;
function weekOfIso(n){
  const mon1 = y => mondayOf(new Date(y, 0, 4));
  let s = addD(mon1(TODAY.getFullYear()), (n - 1) * 7);
  if (addD(s, 6) < TODAY) s = addD(mon1(TODAY.getFullYear() + 1), (n - 1) * 7);
  return s;
}
function nextWeekday(w, allowToday){ let d = allowToday ? TODAY : addD(TODAY, 1); while (d.getDay() !== w) d = addD(d, 1); return d; }
const numOf = s => /^\d+$/.test(s) ? +s : NUMW[s.toLowerCase()];
// Reihenfolge = Priorität: spezifische Angaben zuerst.
const DUE_RULES = [
  { re:'(\\d{1,2})\\.\\s?(\\d{1,2})\\.\\s?(\\d{4}|\\d{2})(?!\\d)', f:m => dayDue(dateDM(+m[1], +m[2] - 1, +m[3])) },                    // 15.09.2026
  { re:'(\\d{1,2})\\.\\s?(\\d{1,2})\\.(?!\\d)', f:m => dayDue(dateDM(+m[1], +m[2] - 1)) },                                           // 15.9.
  { re:'(?:bis(?:\\s+zum)?|am|zum|ab)\\s+(\\d{1,2})\\.(\\d{1,2})(?![\\d.])', f:m => dayDue(dateDM(+m[1], +m[2] - 1)) },               // bis 15.9
  { re:'(\\d{1,2})\\.?\\s*' + MONTH + '\\.?(?:\\s+(\\d{4}))?(?!' + L + ')', f:m => dayDue(dateDM(+m[1], monthIdx(m[2]), m[3] ? +m[3] : null)) },   // 15. September
  { re:ORD_RE + '\\s+' + MONTH + '(?:\\s+(\\d{4}))?(?!' + L + ')', f:m => dayDue(dateDM(ORD.indexOf(m[1].toLowerCase()) + 1, monthIdx(m[2]), m[3] ? +m[3] : null)) }, // fünfzehnten September
  { re:'(ende|mitte|anfang)\\s+(?:des\\s+)?' + MONTH + '(?!' + L + ')', f:m => {                                                    // Ende September
      const s = monthStart(monthIdx(m[2])), k = m[1].toLowerCase();
      if (k === 'ende') return dayDue(new Date(s.getFullYear(), s.getMonth() + 1, 0));
      if (k === 'mitte') return dayDue(new Date(s.getFullYear(), s.getMonth(), 15));
      return week(iso(mondayOf(s.getDay() >= 5 || s.getDay() === 0 ? addD(s, 3) : s)));
  } },
  { re:'ende\\s+(?:des\\s+)?(?:nächsten|kommenden)\\s+monats', f:() => dayDue(new Date(TODAY.getFullYear(), TODAY.getMonth() + 2, 0)) },
  { re:'ende\\s+(?:des|dieses)\\s+monats', f:() => dayDue(new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0)) },
  { re:'(?:kw|kalenderwoche)\\s*(\\d{1,2})(?!\\d)', f:m => +m[1] >= 1 && +m[1] <= 53 ? week(iso(weekOfIso(+m[1]))) : null },          // KW 40
  { re:'(?:ende\\s+)?übernächste[nr]?\\s+woche', f:() => week(iso(addD(THIS_MON, 14))) },
  { re:'(?:ende\\s+)?(?:nächste[nr]?|kommende[nr]?)\\s+woche', f:() => week(iso(NEXT_MON)) },
  { re:'(?:ende\\s+)?(?:diese[rns]?\\s+woche|der\\s+woche)', f:() => week(iso(THIS_MON)) },
  { re:'(?:ende\\s+)?(?:nächste[nrs]?|kommende[nrs]?)\\s+monats?', f:() => month(nextMonthKey()) },
  { re:'(?:diese[nrs]?|im\\s+laufe\\s+des)\\s+monats?', f:() => month(monthKey(TODAY)) },
  { re:'in\\s+(\\d{1,2}|einem|einer|eine|ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)\\s+(tag|tagen|woche|wochen|monat|monaten)(?!' + L + ')', f:m => {   // in zwei Wochen
      const n = numOf(m[1]), u = m[2].toLowerCase();
      if (!n) return null;
      if (u.startsWith('tag')) return dayDue(addD(TODAY, n));
      if (u.startsWith('woche')) return week(iso(mondayOf(addD(TODAY, 7 * n))));
      return month(monthKey(new Date(TODAY.getFullYear(), TODAY.getMonth() + n, 1)));
  } },
  { re:'übermorgen', f:() => dayDue(addD(TODAY, 2)) },
  { re:'(?:am\\s+besten\\s+)?morgen(?!' + L + ')(?:\\s+(?:früh|vormittag|mittag|nachmittag|abend))?', f:() => dayDue(addD(TODAY, 1)) },
  { re:'heute(?!' + L + ')(?:\\s+(?:noch|abend|nachmittag))?', f:() => dayDue(TODAY) },
  { re:'(?:übers\\s+)?wochenende', f:() => dayDue(nextWeekday(6, true)) },
  { re:'(?:(kommenden|nächsten|diesen)\\s+)?' + WEEKDAYS + '(?!' + L + ')', f:m => dayDue(nextWeekday(WDL.findIndex(x => x.toLowerCase() === m[2].toLowerCase()), /diesen/i.test(m[1] || ''))) },
  { re:'(?:im|bis|bis\\s+ende|anfang)\\s+' + MONTH_FULL + '(?!' + L + ')', f:m => month(monthKey(monthStart(monthIdx(m[1])))) },    // im Oktober
  { re:'(?:bis\\s+zum|am|zum)\\s+(\\d{1,2})\\.(?!\\s*\\d)', f:m => {                                                                  // bis zum 20.
      let d = mkDate(TODAY.getFullYear(), TODAY.getMonth(), +m[1]);
      if (!d || d < TODAY) d = mkDate(TODAY.getFullYear(), TODAY.getMonth() + 1, +m[1]);
      return dayDue(d);
  } }
];
const DUE_RX = DUE_RULES.map(r => ({ rx:new RegExp(BOUND + PFX + r.re, 'i'), f:r.f }));
const PERSON_STOP = new Set(('projekt team meeting termin termine kunde kunden kundin chef chefin präsentation budget angebot angebote arbeit woche monat ende anfang mitte '
  + 'frau herr herrn kollege kollegen kollegin kolleginnen familie kinder firma abteilung board steuer steuern bank versicherung arzt ärztin zahnarzt handwerker dachdecker '
  + 'hilfe feedback freigabe rückmeldung unterlagen bericht antrag rechnung vertrag hr it ceo cfo leadership management geschäftsleitung vorstand bereich abstimmung review '
  + 'workshop call telefonat besprechung protokoll zahlen daten info infos einladung mail email nachricht brief paket idee ideen konzept strategie planung deadline heute morgen '
  + 'der die das den dem des ein eine einen einem einer alle allen mich uns sie ihn ihr euch').split(' '));
const projPhraseRe = name => new RegExp(',?\\s*(?:im\\s+|für\\s+(?:das\\s+)?|zum\\s+)?projekt\\s+' + escRe(name), 'i');
function tidy(s){
  s = s.replace(/^\s*idee\s*:\s*/i, '').replace(/,?\s*\b(am besten|irgendwann|bitte)\b\s*/gi, ' ')
       .replace(/\s+,/g, ',').replace(/,(\s*,)+/g, ',').replace(/\s{2,}/g, ' ')
       .replace(/(?:^|\s)(?:bis zum|bis|am|zum|spätestens|und|ab)\s*[,.]?\s*$/i, '')
       .replace(/^[\s,:–-]+|[\s,:.–-]+$/g, '');
  return s ? s[0].toUpperCase() + s.slice(1) : '';
}
const dueText = due => { const l = dueLabel({ due, status:'open' }); return l.txt + (l.k && l.k !== 'ganzer Monat' ? ' · ' + l.k : ''); };
const day = s => ({ type:'day', date:s });
const week = s => ({ type:'week', start:s });
const month = s => ({ type:'month', month:s });
/* Wertet einen diktierten Satz aus: Projekt, Personen, Deadline, Bereich, Unterkategorie.
   Unbekannte Namen („mit Claas“, „Projekt Neubau“) kommen als Vorschläge zum Antippen zurück. */
function parse(text){
  let s = ' ' + text.trim().replace(/\s+/g, ' ') + ' ';
  const r = blank(), rec = [], sugg = [];
  for (const p of [...PROJECTS].sort((a, b) => b.name.length - a.name.length)){
    if (wordRe(p.name).test(s)){
      r.project = p.id; r.area = p.area;
      s = s.replace(projPhraseRe(p.name), ' ');
      rec.push('Projekt: ' + p.name); break;
    }
  }
  if (!r.project){
    const pm = s.match(/(?:im\s+|für\s+(?:das\s+)?|zum\s+)?[Pp]rojekt\s+([A-ZÄÖÜ0-9][\wÄÖÜäöüß&.+-]*(?:\s+[A-ZÄÖÜ0-9][\wÄÖÜäöüß&.+-]*){0,3})/);
    if (pm) sugg.push({ type:'project', name:pm[1].replace(/[.,]+$/, '') });
  }
  PEOPLE.forEach(p => { if (wordRe(p.name).test(s)){ r.persons.push(p.id); rec.push('Person: ' + p.name); } });
  for (const rule of DUE_RX){
    const m = s.match(rule.rx); if (!m) continue;
    const due = rule.f([m[0], ...m.slice(2)]); if (!due) continue;
    r.due = due; s = s.replace(rule.rx, (all, b) => b + ' ');
    rec.push('Deadline: ' + dueText(due)); break;
  }
  const pm2 = s.match(/(^|[\s,])(privat|privates|privater)(?![a-zäöüß])/i);
  const wm = s.match(/(,\s*|\s(?:für\s+die|auf\s+der|in\s+der)\s+|\s)(arbeit|büro|beruflich)(?=\s*[,.]?\s*$|\s*,)/i) || s.match(/(,?\s*)(beruflich)(?![a-zäöüß])/i);
  if (pm2){ r.area = 'private'; s = s.replace(pm2[0], pm2[1] + ' '); }
  else if (wm){ r.area = 'work'; s = s.replace(wm[0], ' '); }
  const cm = CATS.filter(c => c.name !== 'Allgemein').find(c => (!r.area || c.area === r.area) && wordRe(c.name).test(s));
  if (cm){ r.cat = cm.id; r.area = cm.area; }
  if (r.area) rec.push('Bereich: ' + AREAS[r.area].name + (r.cat ? ' · ' + catById(r.cat).name : ''));
  // Unbekannte Personen nach „mit / für / an / bei / von …“ vorschlagen
  const known = new Set([...PEOPLE.map(p => p.name.toLowerCase()), ...CATS.map(c => c.name.toLowerCase()), ...PROJECTS.flatMap(p => p.name.toLowerCase().split(/\s+/))]);
  const seen = new Set();
  for (const m of s.matchAll(/(?:^|[\s,(])(?:mit|Mit|für|Für|an|An|bei|Bei|von|Von|und|zusammen mit|Zusammen mit|sowie)\s+([A-ZÄÖÜ][a-zäöüß]{1,20})(?![A-Za-zÄÖÜäöüß])/g)){
    const n = m[1], k = n.toLowerCase();
    if (PERSON_STOP.has(k) || known.has(k) || seen.has(k)) continue;
    if (sugg.some(x => x.type === 'project' && x.name.toLowerCase().split(/\s+/).includes(k))) continue;
    seen.add(k); sugg.push({ type:'person', name:n });
  }
  r.title = tidy(s);
  return { draft:r, rec, sugg };
}

/* ============ Stammdaten anlegen ============ */
function addEntity(kind, name){
  name = name.trim(); if (!name) return null;
  if (kind.startsWith('cat:')){
    const area = kind.slice(4);
    const ex = CATS.find(c => c.area === area && c.name.toLowerCase() === name.toLowerCase()); if (ex) return ex;
    const c = { id:uid(), area, name }; CATS.push(c); save('cats', c); return c;
  }
  if (kind === 'person'){
    const ex = PEOPLE.find(p => p.name.toLowerCase() === name.toLowerCase()); if (ex) return ex;
    const p = { id:uid(), name }; PEOPLE.push(p); save('people', p); return p;
  }
  if (kind === 'project'){
    const ex = PROJECTS.find(p => p.name.toLowerCase() === name.toLowerCase()); if (ex) return ex;
    const p = { id:uid(), name, area:S.newProjArea }; PROJECTS.push(p); save('projects', p); return p;
  }
}
function removeEntity(store, id){
  const obj = ARR[store]().find(x => x.id === id); if (!obj) return;
  T.forEach(t => {
    let ch = false;
    if (store === 'cats' && t.cat === id){ t.area = obj.area; t.cat = null; ch = true; }
    if (store === 'people' && t.persons.includes(id)){ t.persons = t.persons.filter(x => x !== id); ch = true; }
    if (store === 'projects' && t.project === id){ t.area = areaOf(t); t.project = null; ch = true; }
    if (ch) save('todos', t);
  });
  tomb(store, obj);
  if (S.view.endsWith(':' + id)) S.view = 'today';
}

async function importData(file){
  try {
    const data = JSON.parse(await file.text());
    if (!['brain', 'klar'].includes(data.app) || !Array.isArray(data.todos)) throw new Error('format');
    let n = 0;
    ['cats', 'people', 'projects', 'todos'].forEach(store => {
      const arr = ARR[store]();
      (data[store] || []).forEach(obj => {
        if (!obj || !obj.id || obj.deleted) return;
        const ex = arr.find(x => x.id === obj.id);
        if (ex && (ex.updatedAt || 0) >= (obj.updatedAt || 0)) return;
        if (store === 'todos'){ obj.persons ||= []; obj.desc ||= ''; obj.ctx ||= ''; n++; }
        if (ex) Object.assign(ex, obj); else arr.push(obj);
        put(store, obj);
      });
    });
    autoArchive(); render();
    toast(n ? `Backup importiert · ${n} ${n === 1 ? 'To-do' : 'To-dos'} übernommen` : 'Backup geprüft · alles war schon aktuell');
  } catch (e) {
    toast('Diese Datei ist kein Brain-Backup.');
  }
}

    case 'mdel': S.confirmM = id; renderMain(); break;
    case 'mdel-no': S.confirmM = null; renderMain(); break;
    case 'mdel-yes': removeEntity(el.dataset.store, id); S.confirmM = null; render(); toast('Gelöscht'); break;
    case 'export': exportData(); break;
    case 'import': $('#importfile').click(); break;
    case 'menu': document.body.classList.toggle('sb-open'); syncScrim(); break;
    case 'assist-full': openAssistant('full', A?.capture?.trim() ? { title:A.capture.trim() } : {}); break;
    case 'assist-capture': openAssistant('capture'); break;
    case 'review': case 'edit': {
      const t = T.find(x => x.id === id); if (!t) break;
      const d = { title:t.title, desc:t.desc, ctx:t.ctx, area:areaOf(t), cat:t.cat, persons:[...t.persons], project:t.project, due:t.due };
      if (act === 'review'){
        const rec = [];
        if (namesOf(t.persons).length) rec.push('Person: ' + namesOf(t.persons).join(', '));
        if (t.due) rec.push('Deadline: ' + dueLabel(t).txt);
        if (d.area) rec.push('Bereich: ' + AREAS[d.area].name);
        openAssistant('fill', d, { rec, raw:t.raw, fromId:id });
      } else { openAssistant('full', d, { fromId:id }); A.i = A.steps.length - 1; renderModal(); }
      break;
    }
    // Assistent
    case 'auth-open': S.authMode = 'in'; openAuth(); break;
    case 'auth-close': closeAuth(); break;
    case 'auth-mode': S.authMode = S.authMode === 'in' ? 'up' : 'in'; S.authErr = ''; renderAuth(); break;
    case 'auth-go': authGo(); break;
    case 'auth-out': signOut(); break;
    case 'sync-now': sync(); toast('Gleiche ab …'); break;
    case 'a-close': closeModal(); break;
    case 'a-next': aNext(); break;
    case 'a-back': commitInputs(); A.i = Math.max(0, A.i - 1); renderModal(); break;
    case 'a-skip': commitInputs(); A.i = Math.min(A.steps.length - 1, A.i + 1); renderModal(); break;
    case 'a-jump': aJump(el.dataset.step); break;
    case 'a-sugg': {
      const i = +el.dataset.i, g = A.sugg?.[i]; if (!g) break;
      A.rec ||= [];
      if (g.type === 'person'){
        const p = addEntity('person', g.name);
        if (!A.draft.persons.includes(p.id)) A.draft.persons.push(p.id);
        A.rec.push('Person: ' + p.name);
      } else {
        const prev = S.newProjArea; S.newProjArea = A.draft.area || 'work';
        const p = addEntity('project', g.name); S.newProjArea = prev;
        A.draft.project = p.id; if (!A.draft.area) A.draft.area = p.area;
        A.draft.title = tidy(A.draft.title.replace(projPhraseRe(g.name), ' ')) || A.draft.title;
        A.rec.push('Projekt: ' + p.name);
      }
      A.sugg.splice(i, 1);
      if (A.mode === 'fill'){ const cur = A.steps[A.i]; A.steps = fillSteps(); A.i = Math.max(0, A.steps.indexOf(cur)); }
      renderModal(); break;
    }
    case 'a-save': commitInputs(); aSave(); break;
    case 'a-area':
      A.draft.area = el.dataset.v;
      if (A.draft.cat && catById(A.draft.cat)?.area !== A.draft.area) A.draft.cat = null;
      if (A.draft.project && projById(A.draft.project)?.area !== A.draft.area) A.draft.project = null;
      renderModal(); setTimeout(() => { if (A && A.steps[A.i] === 'area') aNext(); }, 160);
      break;
    case 'a-cat': A.draft.cat = A.draft.cat === el.dataset.v ? null : el.dataset.v; if (A.draft.cat) A.draft.area = catById(A.draft.cat).area; renderModal(); break;
    case 'a-person': { const v = el.dataset.v, ps = A.draft.persons; A.draft.persons = ps.includes(v) ? ps.filter(x => x !== v) : [...ps, v]; renderModal(); break; }
    case 'a-proj': A.draft.project = el.dataset.v || null; if (A.draft.project && !A.draft.area) A.draft.area = projById(A.draft.project).area; renderModal(); break;
    case 'a-due': A.draft.due = DUE_OPTS().find(o => o[0] === el.dataset.v)[2]; renderModal(); break;
  }
});
$('#scrim').addEventListener('click', () => { document.body.classList.remove('sb-open'); if (innerWidth <= 1100) S.sel = null; render(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal'){ S.authOpen ? closeAuth() : closeModal(); } });
$('#modal').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!A || !f) return;
  if (['title', 'desc', 'ctx'].includes(f)) A.draft[f] = e.target.value;
  if (f === 'capture') A.capture = e.target.value;
});
$('#modal').addEventListener('change', e => { if (A && e.target.dataset.f === 'date' && e.target.value){ A.draft.due = day(e.target.value); renderModal(); } });
$('#importfile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });
document.addEventListener('change', e => {
  const r = e.target.dataset.rename; if (!r) return;
  const obj = ARR[r]().find(x => x.id === e.target.dataset.id), v = e.target.value.trim();
  if (!obj) return;
  if (!v){ e.target.value = obj.name; return; }

});

function quickSubmit(v){
  if (!v.trim()) return;
  const { draft, rec, sugg } = parse(v);
  $('#qa').value = '';
  $('#qa').blur();
  openAssistant('fill', draft, { rec, sugg, raw:v.trim() });
}
document.addEventListener('submit', e => { if (e.target.id === 'qaf'){ e.preventDefault(); quickSubmit($('#qa').value); } });
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key === 'Escape'){
    if (S.authOpen) closeAuth(); else if (A) closeModal(); else if (document.body.classList.contains('sb-open')){ document.body.classList.remove('sb-open'); syncScrim(); } else if (S.sel) closeDetail();
    return;
  }
  if (e.isComposing) return;
  if (S.authOpen && e.key === 'Enter'){ e.preventDefault(); authGo(); return; }
  if (e.target.id === 'qa' && e.key === 'Enter'){ e.preventDefault(); quickSubmit(e.target.value); return; }
  if (A && e.key === 'Enter' && !e.shiftKey && e.target.dataset?.f === 'capture'){ e.preventDefault(); aNext(); return; }
  const addE = e.target.dataset?.addE;
  if (addE && e.key === 'Enter'){
    e.preventDefault();
    const t = T.find(x => x.id === e.target.dataset.id); if (!t) return;
    const a = areaOf(t) || 'work';
    let o;
    if (addE === 'cat'){ o = addEntity('cat:' + a, e.target.value); if (o) editTodo(t, t => { t.cat = o.id; t.area = o.area; }); }
    if (addE === 'person'){ o = addEntity('person', e.target.value); if (o) editTodo(t, t => { if (!t.persons.includes(o.id)) t.persons = [...t.persons, o.id]; }); }
    if (addE === 'project'){ const prev = S.newProjArea; S.newProjArea = a; o = addEntity('project', e.target.value); S.newProjArea = prev; if (o) editTodo(t, t => { t.project = o.id; if (!t.area) t.area = o.area; }); }
    if (o) toast(`„${o.name}“ angelegt`);
    return;
  }
  if (e.target.dataset?.ef === 'title' && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); return; }
  const add = e.target.dataset?.add;
  if (add && e.key === 'Enter'){
    e.preventDefault();
    const o = addEntity(add, e.target.value);
    if (o){
      if (e.target.id === 'newcat'){ S.addingCat = null; S.view = 'cat:' + o.id; }
      render(); toast(`„${o.name}“ angelegt`);
      const again = document.querySelector(`[data-add="${add}"]`); if (again && e.target.id !== 'newcat') again.focus();
    }
    return;
  }
  if (e.target.dataset?.rename && e.key === 'Enter'){ e.target.blur(); return; }
  if (A && e.key === 'Enter' && tag === 'INPUT' && ['newcat', 'newperson', 'newproject'].includes(e.target.dataset.f)){ e.preventDefault(); commitInputs(); renderModal(); return; }
  if (A && e.key === 'Enter' && tag === 'INPUT' && e.target.type !== 'date'){ e.preventDefault(); A.steps[A.i] === 'review' ? aSave() : aNext(); return; }
  if (A && e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); commitInputs(); A.steps[A.i] === 'review' ? aSave() : aNext(); return; }
  if (!A && (e.key === 'n' || e.key === 'N') && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    if ($('#qa')) $('#qa').focus(); else openAssistant('capture');
  }
});
document.addEventListener('input', e => {

/* Wischen nach links (wie in Apple Mail): kurz = Löschen-Knopf, weit = direkt löschen */
const SWIPE_OPEN = 104, SWIPE_FAR = 0.55;
let sw = null, swOpen = null;
function swClose(el){ if (!el) return; const r = el.querySelector('.row'); if (r) r.style.transform = ''; el.classList.remove('dragging', 'is-open'); if (swOpen === el) swOpen = null; }
document.addEventListener('touchstart', e => {
  const el = e.target.closest('.swipe');
  if (swOpen && swOpen !== el) swClose(swOpen);
  if (!el || e.touches.length !== 1) return;
  sw = { el, row:el.querySelector('.row'), x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, lock:null };
}, { passive:true });
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (!sw.lock){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw.lock = 'y'; }
    else if (dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.3){ sw.lock = 'x'; sw.el.classList.add('dragging'); }
    else return;
  }
  if (sw.lock !== 'x') return;
  e.preventDefault();
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${sw.dx}px)`;
}, { passive:false });
document.addEventListener('touchend', () => {
  if (!sw) return;
  const { el, row, dx } = sw; const width = el.offsetWidth || 320;
  sw.el.classList.remove('dragging');
  const cur = sw; sw = null;
  if (cur.lock !== 'x'){ return; }
  if (dx < -width * SWIPE_FAR){
    row.style.transform = `translateX(-${width}px)`;
    const t = T.find(x => x.id === el.dataset.swipe);
    setTimeout(() => { if (t) deleteTodo(t); else render(); }, 160);
  } else if (dx < -40){
    row.style.transform = `translateX(-${SWIPE_OPEN}px)`;
    el.classList.add('is-open'); swOpen = el;
  } else {
    row.style.transform = '';
  }
}, { passive:true });

/* ============ Start ============ */
async function boot(){
  loadSess();
  try { S.theme = localStorage.getItem('brain-theme') || localStorage.getItem('klar-theme') || 'auto'; } catch (e) {}
  try { Object.assign(S.openArea, JSON.parse(localStorage.getItem('brain-areas') || '{}')); } catch (e) {}
  applyTheme();
  try {
    idb = await openDB();
    const [t, c, p, pr] = await Promise.all(['todos', 'cats', 'people', 'projects'].map(getAll));
    const live = a => a.filter(x => !x.deleted);
    T = live(t); CATS = live(c); PEOPLE = live(p); PROJECTS = live(pr);
    [t, c, p, pr].forEach(rows => rows.forEach(x => { if (x.deleted) TOMB.set(x.id, x.updatedAt || 0); }));
    S.lastSync = (await getMeta('lastSync')) || 0;
    T.forEach(x => { x.persons ||= []; x.desc ||= ''; x.ctx ||= ''; });
    if (!(await getMeta('seeded'))){ if (sess) pendingSeed = true; else seed(); }
    navigator.storage?.persist?.().catch(() => {});
  } catch (e) {
    idb = null; S.memOnly = true; seed();
    toast('Dieser Browser erlaubt kein dauerhaftes Speichern (privates Fenster?).', null, true);
  }
  autoArchive();
  dedupe();
  render();
  registerSW();
  sync();
  setInterval(sync, 60000);
}
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw?.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Neue Version verfügbar', { act:'reload', label:'Neu laden' }, true);
      });
    });
  }).catch(() => {});
}
boot();
